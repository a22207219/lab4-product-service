services:
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/product_db
      SPRING_DATASOURCE_USERNAME: ${PRODUCT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD}
      SUPPLIER_SERVICE_URL: http://supplier-service:8082
    depends_on:
      product-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  supplier-service:
    build:
      context: .
      dockerfile: supplier-service/Dockerfile
    container_name: supplier-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://supplier-db:5432/supplier_db
      SPRING_DATASOURCE_USERNAME: ${SUPPLIER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SUPPLIER_DB_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8081
    depends_on:
      supplier-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  product-db:
    image: postgres:18
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${PRODUCT_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
    volumes:
      - product_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER} -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  supplier-db:
    image: postgres:18
    container_name: supplier-db
    environment:
      POSTGRES_DB: supplier_db
      POSTGRES_USER: ${SUPPLIER_DB_USER}
      POSTGRES_PASSWORD: ${SUPPLIER_DB_PASSWORD}
    volumes:
      - supplier_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPPLIER_DB_USER} -d supplier_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  product_db_data:
  supplier_db_data:
